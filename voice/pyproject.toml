[project]
name = "jervis-voice"
version = "0.1.0"
description = "Jervis voice loop: wake word, STT, TTS"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jervis_voice"]

[project]
name = "jervis-telegram"
version = "0.1.0"
description = "Talk to Jervis from Telegram"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.scripts]
jervis-telegram = "jervis_telegram.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jervis_telegram"]

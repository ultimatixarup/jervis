# Copied to ~/.jervis/config.yaml by scripts/setup.sh (never overwritten if it exists).

# Sonnet-class model, per PLAN.md §2. Verify against
# https://docs.claude.com/en/docs/about-claude/models before changing.
model: claude-sonnet-5
max_tool_rounds: 12
persona_name: Jervis

voice:
  # Until a custom model is trained the wake phrase is literally "Hey Jarvis".
  # scripts/train-wakeword.sh explains how to get to "Jervis".
  wake_model: hey_jarvis        # or `jervis` once trained; see voice/jervis_voice/models/
  wake_threshold: 0.6           # raise this first if it misfires
  wake_cooldown_seconds: 2.0
  stt_model: mlx-community/whisper-small.en-mlx
  tts_backend: say              # say | elevenlabs  (kokoro is not wired up)
  tts_voice: Daniel
  silence_ms: 700               # how long a pause ends an utterance
  max_utterance_ms: 15000

# Enable a server once its phase has landed. An enabled server that does not exist
# yet is not fatal - the brain reports it and carries on - but it logs an error on
# every start, which trains you to ignore errors.
servers:
  macos:    { enabled: true }                 # Phase 1
  imessage: { enabled: false }                # Phase 4
  mail:     { enabled: false }                # Phase 4
  bank:     { enabled: false, env: sandbox }  # Phase 5
  # Third-party server (@striderlabs/mcp-ubereats), so it cannot declare Jervis tiers -
  # they are set here, by you, not by its author. Anything not listed stays blocked,
  # which matters because `npx -y` pulls the latest version on every launch.
  #
  # Read telegram/TESTING.md's warnings before enabling: ubereats_checkout spends real
  # money on the card saved to your Uber Eats account, and Jervis is reachable from
  # Telegram. The version is pinned deliberately - drop the @0.2.1 and you are running
  # whatever was published most recently.
  ubereats:
    enabled: false
    command: npx
    args: ["-y", "@striderlabs/mcp-ubereats@0.2.1"]
    tool_tiers:
      ubereats_status: read
      ubereats_search: read
      ubereats_get_restaurant: read
      ubereats_view_cart: read
      ubereats_track_order: read
      ubereats_login: write
      ubereats_logout: write
      ubereats_set_address: write
      ubereats_add_to_cart: write
      ubereats_clear_cart: write
      ubereats_checkout: confirm      # spends money; Jervis reads it back and waits
  claudecode: { enabled: true }               # delegate coding work to Claude Code

# Claude Code can read and edit whatever it is pointed at, so these limits live here
# rather than in anything the model can ask for. `ask` is always read-only; `run_task`
# edits files and is confirm-tier, so Jervis reads it back before running it.
claudecode:
  projects:                     # Claude Code may only ever run inside these
    - ~/code
  model: ""                     # empty = whatever Claude Code uses by default
  max_turns: 30
  ask_timeout_seconds: 120
  task_timeout_seconds: 600
  # Shell commands run_task may use. Empty means it can edit files but run nothing.
  # e.g. ["Bash(git status:*)", "Bash(git diff:*)", "Bash(npm test:*)"]
  extra_allowed_tools: []

# Talk to Jervis from Telegram. The allowlist is the whole security model: a bot is
# reachable by anyone who learns its @handle, and Jervis runs shell commands, so an
# empty list means *nobody*. Message @userinfobot in Telegram to get your numeric id.
# The bot token itself goes in ~/.jervis/.env as TELEGRAM_BOT_TOKEN.
telegram:
  allowed_user_ids: []          # e.g. [123456789] - yours, and nobody else's
  poll_timeout: 50
  drop_pending_on_start: true   # ignore anything sent while Jervis was off

# Full traces of every turn, in OpenTelemetry's GenAI conventions, sent to LangSmith.
# The API key goes in ~/.jervis/.env as LANGSMITH_API_KEY.
#
# capture_content is off deliberately. A prompt here holds directory listings and
# message bodies; a tool argument is usually a path from your home directory; Phase 5
# adds balances. Turning it on sends all of that to a third party. With it off you
# still get the shape of every turn - which tools ran, in what order, how long they
# took, token usage, tiers, confirmations and errors - which is what you want for
# debugging.
tracing:
  enabled: false
  endpoint: https://api.smith.langchain.com/otel/v1/traces   # eu.api... for the EU region
  project: jervis
  capture_content: false

permissions:
  confirm_window_seconds: 60
  extra_destructive_patterns: []

paths:
  home: ~/.jervis
  audit_log: ~/.jervis/audit.jsonl
  memory_db: ~/.jervis/memory.db
  logs: ~/.jervis/logs

http:
  host: 127.0.0.1
  port: 7777

name: declining does nothing
setup:
  files:
    "{tmp}/keep.txt": "still here"
turns:
  - user: "bin keep.txt"
    model:
      - tool_use: macos.move_to_trash
        input: { path: "{tmp}/keep.txt" }
    expect:
      asks_confirmation: true
  - user: "no, leave it"
    model:
      - text: "Left where it was."
    expect:
      no_tool_calls: [macos.move_to_trash]
      file_present: "{tmp}/keep.txt"
      audit: { tool: macos.move_to_trash, confirmed: false, ok: false }

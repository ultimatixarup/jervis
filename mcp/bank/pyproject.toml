[project]
name = "jervis-mcp-bank"
version = "0.1.0"
description = "MCP server: read-only bank data via Plaid"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp>=1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jervis_mcp_bank"]

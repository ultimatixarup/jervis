[project]
name = "jervis-mcp-mail"
version = "0.1.0"
description = "MCP server: Gmail read/draft/send"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp>=1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jervis_mcp_mail"]

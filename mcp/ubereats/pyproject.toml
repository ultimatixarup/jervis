[project]
name = "jervis-mcp-ubereats"
version = "0.1.0"
description = "MCP server: Uber Eats ordering"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp>=1.2",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jervis_mcp_ubereats"]

[project]
name = "jervis-mcp-macos"
version = "0.1.0"
description = "MCP server: macOS control"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp>=1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jervis_mcp_macos"]

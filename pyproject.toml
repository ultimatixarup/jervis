[tool.uv.workspace]
members = [
    "brain",
    "voice",
    "mcp/macos",
    "mcp/imessage",
    "mcp/mail",
    "mcp/bank",
    "mcp/ubereats",
    "mcp/claudecode",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "pytest-cov>=6.0",
    "hypothesis>=6.112",
    "respx>=0.21",
    "responses>=0.25",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
]

[tool.uv]
required-version = ">=0.5"
# Jervis is a macOS agent on Apple Silicon (PLAN.md §0, §2). Without this, uv locks
# universally and fails on Linux-only transitive deps - openwakeword pulls
# tflite-runtime on Linux, which has no cp312 wheels.
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W", "ARG", "RUF"]

[tool.ruff.lint.per-file-ignores]
# A pytest fixture arrives as an argument whether or not the test body names it,
# and a stubbed callable must accept the arguments the real one is called with.
"**/tests/**" = ["ARG001", "ARG002", "ARG005"]

[tool.ruff.lint.isort]
# Workspace members are installed into the venv, so ruff would otherwise sort them
# as third-party.
# The repo has a top-level mcp/ directory, so ruff would otherwise classify the
# installed MCP SDK as first-party.
known-third-party = ["mcp"]
known-first-party = [
    "jervis_brain",
    "jervis_voice",
    "jervis_mcp_macos",
    "jervis_mcp_imessage",
    "jervis_mcp_mail",
    "jervis_mcp_bank",
    "jervis_mcp_ubereats",
    "jervis_mcp_claudecode",
]

[tool.mypy]
python_version = "3.12"
# Without this, brain/jervis_brain/x.py resolves as both `brain.jervis_brain.x` and the
# installed `jervis_brain.x`, and mypy refuses to check either.
mypy_path = ["brain", "tests/fixtures", "tests/e2e", "voice", "mcp/macos", "mcp/imessage", "mcp/mail", "mcp/bank", "mcp/ubereats", "mcp/claudecode"]
strict = true
warn_unreachable = true
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "mcp.*",
    "openwakeword.*",
    "sounddevice.*",
    "mlx_whisper.*",
    "webrtcvad.*",
    "plaid.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["brain", "voice", "mcp", "tests"]
# Shared test doubles live here so both brain/tests and tests/e2e can import them.
pythonpath = ["tests/fixtures", "tests/e2e"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
markers = [
    "live: hits the real Anthropic API; skipped unless --live",
    "macos: needs live macOS services (Finder, Keychain, osascript)",
    "slow: takes more than a few seconds",
]

[tool.coverage.run]
branch = true
# __main__.py is exercised by the stdio integration tests, but in a subprocess that
# coverage does not instrument - measuring it here would only ever report 0%.
omit = ["*/tests/*", "*/__main__.py"]
